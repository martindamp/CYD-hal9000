; =====================================================================
;  PlatformIO - CYD (ESP32-2432S028R) Fire Eye
;  All TFT_eSPI configuration is set as build_flags below, so the
;  library's User_Setup.h must NOT be touched.
; =====================================================================

[env:cyd]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git   ; CYD resistive touch

build_flags =
    -O2
    ; --- tell TFT_eSPI the setup comes from here, not from User_Setup.h ---
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1          ; the CYD variant of ILI9341 (important!)
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    ; --- display pins (hardwired on the CYD) ---
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1             ; display on HSPI, touch uses VSPI
    -D LOAD_GLCD=1
    ; --- SPI ---
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    ; --- colour order + inversion ---
    -D TFT_RGB_ORDER=TFT_BGR       ; this CYD variant swaps red/blue
    -D TFT_INVERSION_ON=1          ; this panel shows colours inverted otherwise

; --- Troubleshooting ---
;   all colours negative/inverted? swap TFT_INVERSION_ON for TFT_INVERSION_OFF
;   red/blue swapped (blue fire)? remove the TFT_RGB_ORDER line above
;   screen stays black? swap ILI9341_2_DRIVER for ILI9341_DRIVER
;   touch mirrored? see TOUCH_FLIP_X / TOUCH_FLIP_Y at the top of src/main.cpp
